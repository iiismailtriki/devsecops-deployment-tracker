apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-tracker
  labels:
    app: deployment-tracker

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: deployment-tracker

  template:
    metadata:
      labels:
        app: deployment-tracker

    spec:
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | nindent 8 }}

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: deployment-tracker

          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
{{ toYaml .Values.resources | nindent 12 }}
